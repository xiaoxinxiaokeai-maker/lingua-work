<body><div class="app">
<aside class="side"><div class="brand"><div class="brandmark">L</div><div><b>Lingua Desk</b><small>中英日学习台</small></div></div><div class="side-label">学习目录</div><div id="sideCats"></div><div class="side-tip"><b>工作优先</b><br>先掌握网页设计、电商、修图和电脑硬件表达，再逐步扩展生活词汇。</div></aside>
<main class="main">

let activeCat='all',activeType='all';const KD='lingua-desk-done-v2',KF='lingua-desk-fav-v2';
const el=id=>document.getElementById(id),set=k=>new Set(JSON.parse(localStorage.getItem(k)||'[]')),save=(k,s)=>localStorage.setItem(k,JSON.stringify([...s])),ci=id=>CATS.find(x=>x.id===id);
function speak(t,l){const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=l==='ja-JP'?.78:.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function nav(){const h=CATS.map(c=>`<button class="cat ${c.id===activeCat?'active':''}" data-cat="${c.id}"><span class="ico">${c.icon}</span><span>${c.name}</span><em>${c.id==='all'?DATA.length:DATA.filter(x=>x.cat===c.id).length}</em></button>`).join('');el('sideCats').innerHTML=h;el('mobileCats').innerHTML=h;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;nav();render()})}
function filtered(){const q=el('search').value.trim().toLowerCase(),st=el('statusFilter').value,d=set(KD),f=set(KF);return DATA.map((x,i)=>({x,i})).filter(({x,i})=>(activeCat==='all'||x.cat===activeCat)&&(activeType==='all'||x.type===activeType)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(st==='all'||st==='done'&&d.has(i)||st==='new'&&!d.has(i)||st==='fav'&&f.has(i)))}
function card(x,i){const c=ci(x.cat),d=set(KD).has(i),f=set(KF).has(i);return `<article class="card ${d?'mastered':''}" style="--tone:${c.tone}"><div class="bar"></div><div class="cardmain"><div class="meta"><span>${c.icon} ${c.name}</span><span class="badge ${x.type}">${x.type==='word'?'单词':'句子'}</span>${d?'<span class="master">✓ 已掌握</span>':''}</div><div class="zh">${x.zh}</div><div class="language"><span class="tag">EN</span><div><div class="phrase">${x.en}</div><div class="reading">${x.enp}</div></div></div><div class="language"><span class="tag jp">JP</span><div><div class="phrase">${x.ja}</div><div class="reading">假名：${x.kana}<br>罗马音：${x.romaji}</div></div></div><div class="note">用法：${x.note}</div></div><div class="actions"><button class="action" onclick='speak(${JSON.stringify(x.en)},"en-US")'>▶ 英语发音</button><button class="action" onclick='speak(${JSON.stringify(x.ja)},"ja-JP")'>▶ 日语发音</button><button class="action ${f?'saved':''}" onclick="toggle(${i},'fav')">${f?'★ 已收藏':'☆ 收藏'}</button><button class="action ${d?'done':''}" onclick="toggle(${i},'done')">${d?'✓ 已掌握':'标记掌握'}</button></div></article>`}
function render(){const a=filtered(),d=set(KD);el('cards').innerHTML=a.length?a.map(({x,i})=>card(x,i)).join(''):'<div class="empty">没有找到对应内容，换个关键词或筛选条件试试。</div>';el('sectionTitle').textContent=ci(activeCat).name;el('resultText').textContent=`显示 ${a.length} 条`;el('totalN').textContent=DATA.length;el('wordN').textContent=DATA.filter(x=>x.type==='word').length;el('sentenceN').textContent=DATA.filter(x=>x.type==='sentence').length;el('doneN').textContent=d.size;el('progressBar').style.width=Math.min(100,d.size/DATA.length*100)+'%'}
function toggle(i,t){const k=t==='done'?KD:KF,s=set(k);s.has(i)?s.delete(i):s.add(i);save(k,s);render()}
function randomCard(){const p=filtered(),o=p.length?p[Math.floor(Math.random()*p.length)]:{x:DATA[0]};el('flashCat').textContent=ci(o.x.cat).name+' · '+(o.x.type==='word'?'单词':'句子');el('flashZh').textContent=o.x.zh;el('flashAnswer').innerHTML=`<b>EN</b>　${o.x.en}<br><span style="color:#718099">${o.x.enp}</span><br><br><b>JP</b>　${o.x.ja}<br><span style="color:#718099">${o.x.kana} · ${o.x.romaji}</span>`;el('flashAnswer').hidden=true;el('reveal').textContent='显示答案'}
el('search').oninput=render;el('statusFilter').onchange=render;document.querySelectorAll('#typeSeg button').forEach(b=>b.onclick=()=>{activeType=b.dataset.type;document.querySelectorAll('#typeSeg button').forEach(x=>x.classList.toggle('active',x===b));render();randomCard()});el('nextCard').onclick=randomCard;el('reveal').onclick=()=>{el('flashAnswer').hidden=!el('flashAnswer').hidden;el('reveal').textContent=el('flashAnswer').hidden?'显示答案':'隐藏答案'};const d=new Date(),days=['周日','周一','周二','周三','周四','周五','周六'];el('dateText').textContent=`${d.getMonth()+1}月${d.getDate()}日 · ${days[d.getDay()]}`;nav();render();randomCard();
</script></body></html>
