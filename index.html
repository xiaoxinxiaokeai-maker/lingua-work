<style>

*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#edf4ff,#f9fbff 42%,#f0f6ff);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:14px 14px 96px}
.hero{background:linear-gradient(135deg,#111e46,#214d9d 58%,#187b9a);color:#fff;border-radius:28px;padding:22px;box-shadow:0 24px 55px rgba(18,38,82,.24);position:relative;overflow:hidden}

.hero h1{margin:4px 0 8px;font-size:38px;position:relative;z-index:1}.hero p{margin:0;max-width:720px;color:#dae8fb;line-height:1.7;position:relative;z-index:1}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#d6e5f8}
.toolbar{position:sticky;top:0;z-index:20;margin-top:12px;padding:8px 0;background:linear-gradient(180deg,rgba(238,244,255,.95),rgba(238,244,255,.75),transparent);backdrop-filter:blur(12px)}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px} input.search{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;background:#fff;box-shadow:var(--shadow)} select{border:1px solid var(--line);border-radius:16px;padding:0 12px;background:#fff;font:inherit}

.section-head{display:flex;justify-content:space-between;align-items:end;margin:18px 3px 10px}.section-head h2{margin:0;font-size:22px}.section-head span{font-size:12px;color:var(--muted)}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}

</head>
<body>
<div class="wrap">
<header class="hero">
  <div style="font-size:12px;letter-spacing:.12em;color:#b9daf0">PERSONAL LANGUAGE APP</div>
  <h1>Lingua Work</h1>
  <p>为你的日常、旅行和电商设计工作定制的英语 + 日语学习 App。中文解释、英文、日文、假名和场景例句放在一起，尽量做到一看就懂。</p>
  <div class="hero-row"><span class="pill">🇨🇳 中文解释</span><span class="pill">🇺🇸 英语</span><span class="pill">🇯🇵 日语</span><span class="pill">🔊 发音</span><span class="pill">🧠 小测验</span><span class="pill">⭐ 收藏</span></div>
  <div class="stats"><div class="stat"><b>45</b><span>词句卡</span></div><div class="stat"><b>8</b><span>学习场景</span></div><div class="stat"><b>工作优先</b><span>电商 / 设计 / PC</span></div><div class="stat"><b>离线可用</b><span>单文件网页</span></div></div>
</header>

<div class="toolbar">
  <div class="tools">
    <input id="search" class="search" placeholder="搜索：显卡 / layout / 予約 / 酒店…">
    <select id="langMode"><option value="all">中英日一起看</option><option value="en">英语重点</option><option value="ja">日语重点</option></select>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<section id="cards">
  <div class="section-head"><h2>场景卡片</h2><span id="countText"></span></div>
  <div class="card-grid" id="grid"></div>
</section>

<section id="study">
  <div class="section-head"><h2>学习模式</h2><span>随机抽卡 + 小测验</span></div>
  <div class="study">
    <div class="panel">
      <div class="muted">今日随机卡</div>
      <div class="big" id="randomZh">—</div>
      <div id="randomEn" style="font-weight:800;color:#2854b6"></div>
      <div id="randomJa" style="font-weight:800;color:#0b7d6a;margin-top:6px"></div>
      <div id="randomKana" class="muted" style="margin-top:3px"></div>
      <div style="margin-top:12px"><button class="btn dark" onclick="randomCard()">换一张</button></div>
    </div>
    <div class="panel quiz">
      <div class="muted">三选一</div>
      <div class="quiz-word" id="quizWord">—</div>
      <div class="choices" id="choices"></div>
      <div class="muted" id="quizHint" style="margin-top:10px">选择正确的中文意思</div>
    </div>
  </div>
</section>

<section id="fav">
  <div class="section-head"><h2>我的收藏</h2><span>保存到本机浏览器</span></div>
  <div class="card-grid" id="favGrid"></div>
</section>

<div style="text-align:center;color:#8591a3;font-size:11px;padding:26px 0 8px">Lingua Work · 为工作与日常定制的日英学习 App</div>
</div>

<nav class="bottom"><a href="#cards">卡片</a><a href="#study">学习</a><a href="#fav">收藏</a><a href="#" id="goTop">顶部</a></nav>

const CATS = ["电商工作", "设计沟通", "电脑硬件", "职场沟通", "日常生活", "出行旅游", "餐厅点餐", "购物"];
let activeCat='全部';
let mode='all';

function speak(text,lang){ const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.86;speechSynthesis.cancel();speechSynthesis.speak(u); }
function favs(){return JSON.parse(localStorage.getItem('lingua-favs')||'[]')}
function setFavs(x){localStorage.setItem('lingua-favs',JSON.stringify(x));renderFavs();render();}
function toggleFav(i){let f=favs();f.includes(i)?f=f.filter(x=>x!==i):f.push(i);setFavs(f)}
function cardHTML(x,i){
 const f=favs().includes(i);
 const showEn=mode!=='ja', showJa=mode!=='en';
 return `<article class="card">
  <div class="card-top"><div class="visual">${x.visual}</div><div><div class="cat">${x.icon} ${x.cat}</div><div class="zh">${x.zh}</div>${showEn?`<div class="en">EN · ${x.en}</div>`:''}${showJa?`<div class="ja">JP · ${x.ja}</div><div class="kana">${x.kana}</div>`:''}</div></div>
  <div class="examples">${showEn?`<div class="ex"><b>English</b><br>${x.example_en}</div>`:''}${showJa?`<div class="ex"><b>日本語</b><br>${x.example_ja}</div>`:''}</div>
  <div class="actions">${showEn?`<button class="btn" onclick='speak(${JSON.stringify(x.en)},"en-US")'>🔊 英语</button>`:''}${showJa?`<button class="btn" onclick='speak(${JSON.stringify(x.ja)},"ja-JP")'>🔊 日语</button>`:''}<button class="btn star" onclick="toggleFav(${i})">${f?'★ 已收藏':'☆ 收藏'}</button></div>
 </article>`;
}
function renderTabs(){
 document.getElementById('tabs').innerHTML=['全部',...CATS].map(c=>`<button class="tab ${c===activeCat?'active':''}" onclick="activeCat=${JSON.stringify(c)};renderTabs();render()">${c}</button>`).join('');
}
function filtered(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 return DATA.map((x,i)=>[x,i]).filter(([x])=>(activeCat==='全部'||x.cat===activeCat)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));
}
function render(){
 const arr=filtered();document.getElementById('countText').textContent=`${arr.length} 张`;
 document.getElementById('grid').innerHTML=arr.length?arr.map(([x,i])=>cardHTML(x,i)).join(''):`<div class="empty">没有找到对应内容</div>`;
}
function renderFavs(){
 const f=favs();document.getElementById('favGrid').innerHTML=f.length?f.map(i=>cardHTML(DATA[i],i)).join(''):`<div class="empty">还没有收藏，看到常用的词句可以先点 ☆ 收藏。</div>`;
}
function randomCard(){
 const x=DATA[Math.floor(Math.random()*DATA.length)];
 document.getElementById('randomZh').textContent=x.zh;document.getElementById('randomEn').textContent='EN · '+x.en;document.getElementById('randomJa').textContent='JP · '+x.ja;document.getElementById('randomKana').textContent=x.kana;
}
let quizAnswer=null;
function quiz(){
 const i=Math.floor(Math.random()*DATA.length),x=DATA[i]; quizAnswer=i;
 document.getElementById('quizWord').textContent=Math.random()>.5?x.en:x.ja;
 let opts=[i];while(opts.length<3){let n=Math.floor(Math.random()*DATA.length);if(!opts.includes(n))opts.push(n)}opts.sort(()=>Math.random()-.5);
 document.getElementById('choices').innerHTML=opts.map(n=>`<button class="choice" onclick="answer(this,${n})">${DATA[n].zh}</button>`).join('');
 document.getElementById('quizHint').textContent='选择正确的中文意思';
}
function answer(btn,n){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(n===quizAnswer){btn.classList.add('ok');document.getElementById('quizHint').textContent='答对了 ✓';}else{btn.classList.add('bad');document.getElementById('quizHint').textContent='正确答案：'+DATA[quizAnswer].zh;}setTimeout(quiz,1200)}
document.getElementById('search').addEventListener('input',render);
document.getElementById('langMode').addEventListener('change',e=>{mode=e.target.value;render();renderFavs()});
document.getElementById('goTop').addEventListener('click',e=>{e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})});
renderTabs();render();renderFavs();randomCard();quiz();
</script>
</body></html>
